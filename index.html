<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Travel and landscape photography by Brandon DeLay, organized by year and trip.">

<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" id="brand">Brandon DeLay</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>

      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="map.js?v=3"></script>
