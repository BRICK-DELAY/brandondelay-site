<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Workouts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317181a'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23d9b77e' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121314; --bg-raised: #1b1c1e; --line: #2a2b2e;
      --text: #efe9df; --muted: #a39e95; --accent: #d9b77e;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: 0 auto; padding: clamp(28px, 6vw, 64px) 16px calc(64px + env(safe-area-inset-bottom)); }
    .eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 9vw, 64px); line-height: 1.02; margin: 8px 0 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
    .chip b { color: var(--text); font-weight: 600; }
    .notes { color: #d8d2c8; margin: 16px 0 0; white-space: pre-line; }
    .stale { margin: 0 0 20px; padding: 12px 14px; border: 1px solid rgba(217,183,126,.4); border-radius: 12px; color: var(--accent); font-size: 14px; }
    .progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 24px 0 4px; }
    .progress div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .progress-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    section { margin-top: 32px; }
    h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h2 span { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .sec-note { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
    .item {
      display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
      padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .item:last-child { border-bottom: 1px solid var(--line); }
    .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid #4a4b4f; display: grid; place-items: center; margin-top: 1px; transition: background .15s, border-color .15s; }
    .box svg { opacity: 0; transition: opacity .15s; }
    .item.done .box { background: var(--accent); border-color: var(--accent); }
    .item.done .box svg { opacity: 1; }
    .item.done .name, .item.done .spec { opacity: .45; }
    .item.done .name { text-decoration: line-through; text-decoration-color: rgba(239,233,223,.4); }
    .name { font-weight: 600; font-size: 17px; }
    .spec { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; color: var(--muted); font-size: 14px; }
    .spec .main { color: var(--accent); font-weight: 600; }
    .inote { margin-top: 4px; font-size: 14px; color: #c9c3b9; }
    .md h1, .md h2, .md h3 { font-family: var(--serif); font-weight: 600; }
    .md ul { padding-left: 20px; } .md li { margin: 4px 0; }
    .empty { margin-top: 18vh; text-align: center; color: var(--muted); }
    .empty h1 { color: var(--text); }
    footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
    footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }

    .who { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; margin-bottom: 28px; }
    .who button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 999px; cursor: pointer; }
    .who button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .who button .n { font-weight: 500; opacity: .7; margin-left: 4px; }
    .carry { margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: rgba(217,183,126,.1); color: var(--accent); font-size: 14px; }
    .upnext { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .complete { margin-top: 32px; width: 100%; padding: 16px; border-radius: 999px; border: 1px solid var(--accent); background: none; color: var(--accent); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
    .complete.ready { background: var(--accent); color: #1a1408; }
    .complete[disabled] { opacity: .5; cursor: wait; }
    .donebox { margin-top: 18px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; text-align: center; }
    .donebox .big { font-family: var(--serif); font-size: 30px; }
    .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
    .keypanel { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
    .keypanel input { width: 100%; padding: 12px 14px; margin: 8px 0 10px; background: var(--bg-raised); color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .keypanel button { padding: 10px 18px; border-radius: 999px; border: 0; background: var(--accent); color: #1a1408; font: inherit; font-weight: 700; cursor: pointer; }
    .err { color: #e57a6e; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <div class="who" id="who" role="group" aria-label="Whose workout"></div>
    <div id="app"><p class="empty">Loading…</p></div>
  </main>

  <script src="shared.js"></script>
  <script>
    // Each person's oldest unfinished workout, from workouts/plan.json (see FORMAT.md).
    // Exercise ticks are remembered on this device; "Mark workout complete" saves to
    // the site so the next workout comes up and the agent knows.
    (function () {
      "use strict";
      const W = window.Workouts, esc = W.esc;
      const app = document.getElementById("app"), whoEl = document.getElementById("who");
      const todayKey = W.today();
      const prettyDate = (key, opts) => {
        const [y, m, d] = String(key).split("-").map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, opts || { weekday: "long", month: "long", day: "numeric" });
      };
      const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000);

      let plan = null;
      let who = (location.hash.slice(1) in W.PEOPLE) ? location.hash.slice(1) : (() => { try { return localStorage.getItem("workout-who"); } catch (e) { return null; } })() || "brandon";
      if (!(who in W.PEOPLE)) who = "brandon";

      function markdown(text) {
        const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
        let html = "", inList = false;
        String(text).split(/\r?\n/).forEach((line) => {
          const t = line.trim();
          if (/^[-*•]\s+/.test(t)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(t.replace(/^[-*•]\s+/, ""))}</li>`; return; }
          if (inList) { html += "</ul>"; inList = false; }
          const h = /^(#{1,3})\s+(.*)$/.exec(t);
          if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
          else if (t) html += `<p>${inline(t)}</p>`;
        });
        return html + (inList ? "</ul>" : "");
      }

      function renderWho() {
        whoEl.innerHTML = Object.entries(W.PEOPLE).map(([id, name]) => {
          const n = plan ? W.pending(plan.people[id]).length : 0;
          return `<button type="button" data-who="${id}" aria-pressed="${id === who}">${esc(name)}${n > 1 ? `<span class="n">${n}</span>` : ""}</button>`;
        }).join("");
        whoEl.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
          who = b.dataset.who;
          try { localStorage.setItem("workout-who", who); } catch (e) { /* ignore */ }
          history.replaceState(null, "", "#" + who);
          render();
        }));
      }

      function workoutHTML(w, doneMap) {
        const chips = [];
        if (w.focus) chips.push(`<span class="chip">${esc(w.focus)}</span>`);
        if (w.duration_min) chips.push(`<span class="chip"><b>${esc(w.duration_min)}</b> min</span>`);
        if (w.location) chips.push(`<span class="chip">${esc(w.location)}</span>`);
        if (w.intensity) chips.push(`<span class="chip">${esc(w.intensity)}</span>`);
        let total = 0;
        const sections = (w.sections || []).map((sec, si) => {
          const items = (sec.items || []).map((it, ii) => {
            const id = `${si}-${ii}`;
            total++;
            const sets = it.sets && it.reps ? `${it.sets} × ${it.reps}` : it.sets ? `${it.sets} sets` : it.reps ? it.reps : "";
            const spec = [
              sets ? `<span class="main">${esc(sets)}</span>` : "",
              it.duration ? `<span class="main">${esc(it.duration)}</span>` : "",
              it.distance ? `<span class="main">${esc(it.distance)}</span>` : "",
              it.weight ? `<span>${esc(it.weight)}</span>` : "",
              it.tempo ? `<span>Tempo ${esc(it.tempo)}</span>` : "",
              it.rest ? `<span>Rest ${esc(it.rest)}</span>` : "",
              it.detail ? `<span>${esc(it.detail)}</span>` : "",
            ].filter(Boolean).join("");
            return `<div class="item${doneMap[id] ? " done" : ""}" data-id="${id}" role="checkbox" aria-checked="${!!doneMap[id]}" tabindex="0">
              <div class="box"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#121314" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <div><div class="name">${esc(it.exercise || it.name || "")}</div>${spec ? `<div class="spec">${spec}</div>` : ""}${it.notes ? `<div class="inote">${esc(it.notes)}</div>` : ""}</div>
            </div>`;
          }).join("");
          return `<section><h2>${esc(sec.name || "")}${sec.rounds ? `<span>${esc(sec.rounds)} rounds</span>` : ""}</h2>${sec.notes ? `<p class="sec-note">${esc(sec.notes)}</p>` : ""}${items}</section>`;
        }).join("");
        return { total, html: `
          <h1>${esc(w.title || "Workout")}</h1>
          ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
          ${w.notes ? `<p class="notes">${esc(w.notes)}</p>` : ""}
          ${total ? `<div class="progress"><div id="bar"></div></div><div class="progress-label" id="count"></div>` : ""}
          ${sections}
          ${w.markdown ? `<div class="md">${markdown(w.markdown)}</div>` : ""}
          ${w.cooldown ? `<p class="notes">${esc(w.cooldown)}</p>` : ""}` };
      }

      // Ask for the GitHub key in place, then run `then`.
      function askKey(then, errMsg) {
        const host = document.getElementById("keyslot");
        host.innerHTML = `<div class="keypanel">
          <b>One-time setup on this phone</b>
          <p class="sec-note" style="margin-top:6px">Paste the GitHub key for the workout page so it can save your progress. It's remembered on this device.</p>
          <input type="password" id="keyIn" placeholder="github_pat_…" autocapitalize="none" spellcheck="false">
          <button type="button" id="keyGo">Save key and continue</button>
          ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}
        </div>`;
        document.getElementById("keyGo").addEventListener("click", () => {
          const k = document.getElementById("keyIn").value.trim();
          if (!k) return;
          W.setKey(k);
          host.innerHTML = "";
          then();
        });
      }

      async function saveCompleted(id, done) {
        const btn = document.getElementById("complete") || document.getElementById("undo");
        const key = W.getKey();
        if (!key) return askKey(() => saveCompleted(id, done));
        if (btn) btn.disabled = true;
        try {
          const out = await W.setCompleted(key, who, id, done);
          plan = out.plan;
          render(done ? id : null);
        } catch (e) {
          if (btn) btn.disabled = false;
          if (/key/i.test(e.message)) { W.setKey(""); askKey(() => saveCompleted(id, done), e.message); }
          else document.getElementById("keyslot").innerHTML = `<div class="err">${esc(e.message)}</div>`;
        }
      }

      function render(justFinishedId) {
        renderWho();
        const person = plan.people[who];
        const name = W.PEOPLE[who];
        const w = W.current(person);
        const lastDone = [...person.queue].reverse().find((x) => x.completed);

        if (!w) {
          const finishedToday = lastDone && lastDone.completed === todayKey;
          app.innerHTML = `<div class="eyebrow">${esc(prettyDate(todayKey))} · ${esc(name)}</div>
            <div class="donebox">
              ${finishedToday ? `<div class="big">Done for today ✓</div><p class="sec-note">${esc(lastDone.title)} is checked off. The next workout shows up after it's posted.</p>
                <button type="button" class="linkish" id="undo">Oops, it's not done yet</button>`
              : `<div class="big">No workout waiting</div><p class="sec-note">The next one will show here as soon as it's posted.</p>`}
            </div><div id="keyslot"></div>`;
          document.getElementById("undo")?.addEventListener("click", () => saveCompleted(lastDone.id, false));
          document.title = `Workouts · ${name}`;
          return;
        }

        const doneKey = `workout-done-${w.id}`;
        let doneMap = {};
        try { doneMap = JSON.parse(localStorage.getItem(doneKey)) || {}; } catch (e) { doneMap = {}; }
        const { total, html } = workoutHTML(w, doneMap);
        const waiting = W.pending(person);
        const late = w.date && w.date < todayKey ? daysBetween(w.date, todayKey) : 0;

        app.innerHTML = `
          ${late ? `<p class="carry">Carried over from ${esc(prettyDate(w.date, { weekday: "long", month: "short", day: "numeric" }))}: still to do, so you don't skip it.</p>` : ""}
          <div class="eyebrow">${esc(prettyDate(todayKey))} · ${esc(name)}</div>
          ${html}
          <button type="button" class="complete" id="complete">Mark workout complete</button>
          ${waiting.length > 1 ? `<p class="upnext">Up next: ${waiting.slice(1).map((x) => esc(x.title)).join(", ")}</p>` : ""}
          <div id="keyslot"></div>
          <footer><button type="button" class="linkish" id="reset">Clear checkmarks</button></footer>`;

        const update = () => {
          const n = Object.values(doneMap).filter(Boolean).length;
          const bar = document.getElementById("bar"), count = document.getElementById("count");
          if (bar) bar.style.width = (total ? (n / total) * 100 : 0) + "%";
          if (count) count.textContent = n === total ? "All exercises done — mark it complete below" : `${n} of ${total} done`;
          document.getElementById("complete").classList.toggle("ready", !total || n === total);
        };
        const save = () => { try { localStorage.setItem(doneKey, JSON.stringify(doneMap)); } catch (e) { /* ignore */ } };
        app.querySelectorAll(".item").forEach((el) => {
          const toggle = () => {
            doneMap[el.dataset.id] = !doneMap[el.dataset.id];
            el.classList.toggle("done", doneMap[el.dataset.id]);
            el.setAttribute("aria-checked", String(doneMap[el.dataset.id]));
            save(); update();
          };
          el.addEventListener("click", toggle);
          el.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
        });
        document.getElementById("reset").addEventListener("click", () => {
          doneMap = {}; save();
          app.querySelectorAll(".item.done").forEach((el) => { el.classList.remove("done"); el.setAttribute("aria-checked", "false"); });
          update();
        });
        document.getElementById("complete").addEventListener("click", () => saveCompleted(w.id, true));
        update();
        document.title = `${w.title} · ${name}`;
      }

      window.addEventListener("hashchange", () => { if (location.hash.slice(1) in W.PEOPLE) { who = location.hash.slice(1); if (plan) render(); } });
      W.loadPublic().then((p) => { plan = p; render(); }).catch((e) => {
        app.innerHTML = `<div class="empty"><h1>Couldn't load</h1><p>${esc(e.message)}</p></div>`;
      });
    })();
  </script>
</body>
</html>
